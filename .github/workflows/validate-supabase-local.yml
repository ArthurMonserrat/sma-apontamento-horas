name: Validate local Supabase Auth and Data API

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/validate-supabase-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    name: Supabase local Auth/Data API/RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Verify local-only configuration
        run: |
          test -f supabase/config.toml
          if grep -R -E 'supabase\.co|SUPABASE_URL|project-ref|service_role|sb_secret_' supabase/config.toml supabase/tests/local_auth_data_api.sh; then
            echo 'Remote project references or privileged key literals are forbidden in local integration tests.'
            exit 1
          fi

      - name: Start disposable Supabase stack
        run: supabase start --yes

      - name: Reset local database with versioned migrations only
        run: supabase db reset --local --no-seed --yes

      - name: Export local credentials without printing them
        shell: bash
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          for secret in ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            value="${!secret}"
            echo "::add-mask::$value"
            echo "$secret=$value" >> "$GITHUB_ENV"
          done
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Exercise Auth, Data API and RLS with synthetic users
        shell: bash
        run: bash supabase/tests/local_auth_data_api.sh

      - name: Stop and discard local Supabase
        if: always()
        run: supabase stop --no-backup
