name: Validate identity reconciliation migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/validate-stage3b1-migration.yml'

permissions:
  contents: read

jobs:
  historical:
    name: New database reconciliation check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: historical
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d historical"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify recovered migration checksum
        shell: bash
        run: |
          expected='4ef1871ed3cd19181bdd0b7a30ac6130'
          actual="$(md5sum supabase/migrations/20261010215524_create_initial_workforce_time_tracking_schema.sql | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Historical migration checksum mismatch: $actual"
            exit 1
          fi
          echo "Historical migration MD5: $actual"

      - name: Apply synthetic Auth prelude
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/tests/historical_auth_prelude.sql

      - name: Apply recovered historical migration
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/migrations/20261010215524_create_initial_workforce_time_tracking_schema.sql

      - name: Assert historical structure and privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/tests/historical_assertions.sql
          echo 'Historical baseline: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply identity reconciliation prerequisites
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/migrations/20261016190000_identity_reconciliation_prerequisites.sql

      - name: Apply Stage 3B.1 to reconstructed historical schema
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/migrations/20261016210000_stage3b1_identity_foundation.sql

      - name: Apply identity contract convergence
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/migrations/20261016220000_identity_contract_convergence.sql

      - name: Assert reconstructed historical contract
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname historical --file supabase/tests/reconciliation_assertions.sql

      - name: Publish validation scope
        run: |
          {
            echo '### Migration validation scope'
            echo '- Historical baseline: PASS'
            echo '- Historical → prerequisites → Stage 3B.1 → convergence: PASS'
            echo '- Full managed Supabase validation: NOT TESTED'
          } >> "$GITHUB_STEP_SUMMARY"

  legacy:
    name: Legacy schema reconciliation check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legacy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d legacy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply synthetic legacy baseline and simulate partial application
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/tests/stage3b1_baseline.sql

      - name: Apply identity reconciliation prerequisites
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/migrations/20261016190000_identity_reconciliation_prerequisites.sql

      - name: Apply Stage 3B.1 to legacy schema
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/migrations/20261016210000_stage3b1_identity_foundation.sql

      - name: Reapply Stage 3B.1 to verify guarded retry
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/migrations/20261016210000_stage3b1_identity_foundation.sql

      - name: Apply identity contract convergence
        env:
          PGPASSWORD: postgres
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/migrations/20261016220000_identity_contract_convergence.sql

      - name: Execute legacy SQL assertions
        env:
          PGPASSWORD: postgres
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/tests/stage3b1_assertions.sql
          psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname legacy --file supabase/tests/reconciliation_assertions.sql
          {
            echo '### Migration validation scope'
            echo '- Legacy synthetic → prerequisites → Stage 3B.1 → convergence: PASS'
            echo '- Full managed Supabase validation: NOT TESTED'
          } >> "$GITHUB_STEP_SUMMARY"
